<style>
  :root{
    --paper:#fbf7f4; --ink:#4a3b45; --ink-soft:#8c7a86;
    --rose:#e9a2b8; --rose-deep:#d4788f;
    --lilac:#e6d9f5; --pink:#fbd9e3; --green:#d9efd9; --yellow:#fdf1c4; --grey:#e8e6ea;
    --line:#eadde3;
    --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:'Nunito', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#fbf7f4 !important;color-scheme:light only}
  html,body{height:100%}
  .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 10%, #fde6ee 0, transparent 40%),radial-gradient(circle at 85% 90%, #ece2f8 0, transparent 40%),#fbf7f4 !important}
  body{
    font-family:var(--sans);color:var(--ink);
    background:var(--paper) !important;
    min-height:100vh;padding:32px 16px 60px;display:flex;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%;max-width:560px}
  header{text-align:center;margin-bottom:22px}
  .bow{width:64px;height:auto;display:block;margin:0 auto 8px}
  h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.01em;color:var(--ink)}
  h1 em{font-style:italic;font-weight:600;color:var(--rose-deep)}
  .tag{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink-soft);margin-top:6px}
  .rule{width:120px;height:1px;background:var(--rose);margin:16px auto 0;position:relative}
  .rule::before,.rule::after{content:"";position:absolute;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--rose)}
  .rule::before{left:-10px}.rule::after{right:-10px}

  /* mode switch */
  .modes{display:flex;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px;margin:0 auto 18px;max-width:340px;box-shadow:0 6px 18px rgba(212,120,143,.10)}
  .modes button{flex:1;font-family:var(--sans);font-weight:800;font-size:15px;border:none;background:transparent;color:var(--ink-soft);border-radius:999px;padding:11px 10px;cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s}
  .modes button.on{background:var(--rose-deep);color:#fff;box-shadow:0 4px 12px rgba(212,120,143,.35)}
  .modes button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

  .sheet{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;box-shadow:0 10px 30px rgba(212,120,143,.10);position:relative}
  .sheet::before{content:"";position:absolute;inset:8px;border:1px dashed #f0dce4;border-radius:16px;pointer-events:none}
  .sheet > *{position:relative}
  .add{display:flex;gap:10px;margin-bottom:16px}
  .add input{flex:1;min-width:0;font-family:var(--sans);font-size:16px;color:var(--ink);padding:13px 16px;border:1.5px solid var(--line);border-radius:999px;background:#fffafc;outline:none;transition:border-color .15s}
  .add input:focus{border-color:var(--rose)}
  .add input::placeholder{color:#bfaab6}
  .btn{font-family:var(--sans);font-weight:800;font-size:15px;border:none;border-radius:999px;padding:13px 20px;cursor:pointer;transition:transform .1s, box-shadow .15s;touch-action:manipulation}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
  .btn-rose{background:var(--rose-deep);color:#fff;box-shadow:0 5px 14px rgba(212,120,143,.35)}
  .btn-ghost{background:transparent;color:var(--rose-deep);border:1.5px solid var(--rose)}
  .btn-wide{width:100%;padding:16px;font-size:17px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .top h2{font-family:var(--serif);font-weight:600;font-size:26px;color:var(--ink)}
  .count{font-weight:800;color:var(--rose-deep);white-space:nowrap}
  .progress{height:8px;background:#f3e9ee;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--rose),var(--rose-deep));width:0;transition:width .4s}

  ul.list{list-style:none;margin-bottom:18px}
  ul.list li{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;margin-bottom:8px;border-radius:14px;font-weight:600;font-size:16px}
  .tick{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid rgba(74,59,69,.3);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;touch-action:manipulation;transition:background .15s,border-color .15s}
  .tick:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
  li.done .tick{background:#7cc48d;border-color:#7cc48d}
  ul.list li span.txt{flex:1;line-height:1.3}
  li.done span.txt{text-decoration:line-through;opacity:.55}
  ul.list li button.x{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:20px;line-height:1;padding:4px 6px;border-radius:8px;touch-action:manipulation}
  ul.list li button.x:hover{background:rgba(255,255,255,.6);color:var(--ink)}
  .empty{text-align:center;color:var(--ink-soft);font-family:var(--serif);font-style:italic;font-size:20px;padding:24px 0 30px}
  .c-lilac{background:var(--lilac)} .c-pink{background:var(--pink)} .c-green{background:var(--green)} .c-yellow{background:var(--yellow)} .c-grey{background:var(--grey)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:18px}
  .card{perspective:900px;-webkit-perspective:900px;height:180px;cursor:pointer;touch-action:manipulation}
  .card:focus-visible{outline:3px solid var(--lilac);outline-offset:3px;border-radius:16px}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
  .card.flipped .card-inner{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 6px 16px rgba(74,59,69,.08)}
  .card.flipped .back{pointer-events:none;visibility:hidden;transition:visibility 0s .3s}
  .card:not(.flipped) .front{pointer-events:none}
  .back{background:#fff;border:1.5px solid var(--line);background-image:radial-gradient(circle, #f3dde6 1.4px, transparent 1.6px);background-size:14px 14px}
  .back .bow-mini{width:44px;height:auto;background:#fff;border-radius:50%;padding:6px}
  .back .num{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);margin-top:8px}
  .front{transform:rotateY(180deg);-webkit-transform:rotateY(180deg);z-index:2}
  .front .task{font-weight:700;font-size:16px;line-height:1.3;margin-bottom:12px;color:var(--ink)}
  .front .small{font-family:var(--sans);font-weight:800;font-size:14px;background:#fff;color:var(--rose-deep);border:none;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 3px 8px rgba(74,59,69,.1);position:relative;z-index:3;touch-action:manipulation}
  .card.done .front{opacity:.55}
  .card.done .front .task{text-decoration:line-through}
  .card.done .front .small{visibility:hidden}
  .stamp{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#7cc48d;color:#fff;font-weight:800;font-size:16px;display:none;align-items:center;justify-content:center;transform:rotate(-12deg);box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .card.done .stamp{display:flex}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .btn{flex:1}
  .overlay{position:fixed;inset:0;background:rgba(74,59,69,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex}
  .pop{width:100%;max-width:440px;background:#fff;border-radius:28px;padding:38px 30px 30px;text-align:center;box-shadow:0 30px 70px rgba(74,59,69,.3);position:relative;animation:popIn .45s cubic-bezier(.2,1.2,.4,1)}
  .pop::before{content:"";position:absolute;inset:10px;border:1.5px dashed var(--rose);border-radius:20px;pointer-events:none}
  .pop .bow{width:80px;margin-bottom:6px}
  .pop .kicker{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--rose-deep);margin-bottom:8px}
  .pop .msg{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;color:var(--ink);margin-bottom:24px;position:relative}
  .pop .btn{position:relative}
  @keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.pop{animation:none}.card-inner{transition:none}}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
  .hidden{display:none !important}
  footer{text-align:center;margin-top:22px;font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:16px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <svg class="bow" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M60 40 C40 10 10 12 12 32 C14 50 40 50 60 40Z" fill="#e9a2b8"/>
      <path d="M60 40 C80 10 110 12 108 32 C106 50 80 50 60 40Z" fill="#e9a2b8"/>
      <path d="M60 40 C46 22 22 24 24 34 C26 44 46 46 60 40Z" fill="#f4bfd0"/>
      <path d="M60 40 C74 22 98 24 96 34 C94 44 74 46 60 40Z" fill="#f4bfd0"/>
      <path d="M60 40 L46 76 L58 66 L60 40Z" fill="#d4788f"/>
      <path d="M60 40 L74 76 L62 66 L60 40Z" fill="#d4788f"/>
      <circle cx="60" cy="40" r="9" fill="#d4788f"/>
      <circle cx="57" cy="37" r="3" fill="#f4bfd0"/>
    </svg>
    <h1>The Get <em>Shit</em> Done List</h1>
    <div class="tag">for crafters who've got far too much on</div>
    <div class="rule"></div>
  </header>

  <div class="modes" role="tablist" aria-label="Pick a mode">
    <button type="button" id="modeList" class="on" role="tab" aria-selected="true">📝 List mode</button>
    <button type="button" id="modeGame" role="tab" aria-selected="false">🃏 Game mode</button>
  </div>

  <section class="sheet" id="listMode">
    <div class="add">
      <input id="taskInput" type="text" placeholder="what shit needs doing today?" maxlength="80" autocomplete="off" enterkeyhint="done">
      <button type="button" class="btn btn-rose" id="addBtn">Add it</button>
    </div>
    <div class="top" id="listTop">
      <h2>Tick 'em off</h2>
      <span class="count" id="listCount"></span>
    </div>
    <div class="progress" id="listProgress"><div id="listBar"></div></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="emptyMsg">nowt on the list yet…</div>
    <div class="row" id="listRow">
      <button type="button" class="btn btn-rose" id="shuffleBtn">Play it as a game ✦</button>
      <button type="button" class="btn btn-ghost" id="clearBtn">Start a new day</button>
    </div>
  </section>

  <section class="sheet hidden" id="deckMode">
    <div id="deckEmpty" class="empty hidden">no cards to deal yet… pop your jobs in list mode first</div>
    <div id="deckBody">
      <div class="top">
        <h2>Flip a card. That's your job.</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="grid" id="grid"></div>
      <div class="row">
        <button type="button" class="btn btn-ghost" id="reshuffleBtn">Shuffle again</button>
        <button type="button" class="btn btn-ghost" id="backBtn">Back to the list</button>
      </div>
    </div>
  </section>

  <footer>the cards don't lie 🩷</footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-live="assertive">
  <div class="pop">
    <svg class="bow" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M60 40 C40 10 10 12 12 32 C14 50 40 50 60 40Z" fill="#e9a2b8"/>
      <path d="M60 40 C80 10 110 12 108 32 C106 50 80 50 60 40Z" fill="#e9a2b8"/>
      <path d="M60 40 C46 22 22 24 24 34 C26 44 46 46 60 40Z" fill="#f4bfd0"/>
      <path d="M60 40 C74 22 98 24 96 34 C94 44 74 46 60 40Z" fill="#f4bfd0"/>
      <path d="M60 40 L46 76 L58 66 L60 40Z" fill="#d4788f"/>
      <path d="M60 40 L74 76 L62 66 L60 40Z" fill="#d4788f"/>
      <circle cx="60" cy="40" r="9" fill="#d4788f"/>
      <circle cx="57" cy="37" r="3" fill="#f4bfd0"/>
    </svg>
    <div class="kicker" id="popKicker"></div>
    <div class="msg" id="popMsg"></div>
    <button type="button" class="btn btn-rose" id="popClose">Okay okay, I'm going</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
  const COLOURS = ['c-lilac','c-pink','c-green','c-yellow','c-grey'];
  const ADDED = [
    "added. now it's real and you can't unsee it 👁️",
    "on the list. the list forgets nothing 👁️",
    "noted. future you says cheers, present you says bollocks",
    "another one. you absolute machine 🩷",
    "written down = halfway done. that's science, don't argue",
    "good. now stop adding and start doing 😘",
    "ooh, ambitious. love that for you",
    "in it goes. the list is judging you now",
    "added. that's one more thing between you and the sofa",
    "lovely. now it's the list's problem, not your brain's",
    "brave of you to write that down. proud of you 🩷",
    "noted. the kettle's watching, don't let it down",
    "on the list. no take-backsies",
    "added, and not a moment too soon by the sounds of it",
    "right, that's in. don't you dare pretend you forgot",
    "added. you're basically organised now. basically.",
  ];
  const FLIPPED = [
    "fate dealt it. you do it. them's the rules",
    "the cards don't lie. off you pop 🩷",
    "this one. no faffing. go",
    "the deck has spoken, babe",
    "not the one you wanted? tough tits. crack on",
    "right, that's your job. kettle can wait",
    "ooh unlucky. still doing it though",
    "the universe picked this one. take it up with the universe",
    "no swapsies. go on, get it done",
    "that's the one. don't look at the others, that's cheating",
    "the deck knows what you've been avoiding 👀",
    "this one's been on your mind all week. sort it",
    "bad luck, but the bow said so",
    "there it is. you knew it was coming",
    "well well well. if it isn't the job you've been dodging",
    "flip done, excuses gone. off you go",
  ];
  const DONE = [
    "GET IN, YOU ABSOLUTE WEAPON 🎉",
    "done! and they said you were all mouth 💅",
    "that job's dead. you killed it. no witnesses 💅",
    "done, and you didn't even cry. growth 🩷",
    "smashed it. somebody give this woman a medal and a gin",
    "look at you, doing shit like a functioning adult",
    "one less thing to lie awake about. beautiful",
    "ticked. tick tick tickety boo, get you",
    "oh she's on FIRE today 🔥",
    "done. that's your 3am brain told",
    "another one bites the dust. you menace",
    "gone. dead. finished. next 💪",
    "you did the thing! the actual thing!",
    "ticked off like a legend. hydrate, then carry on",
    "done. not perfect, just done. that's the whole point",
    "ooh, that felt good didn't it. admit it",
    "boom. the list is scared of you now",
    "done and dusted, you little powerhouse",
    "crossed off. your mum would be proud. probably.",
    "that's a wrap on that one. absolute scenes 🎉",
  ];
  const ALLDONE = [
    "The whole deck. THE WHOLE DECK. Someone check on procrastination, she's not answering 😂",
    "List = annihilated. Kettle on, arse on sofa, phone on silent. That's an order.",
    "Every. Single. One. Go and be smug at someone about it 🩷",
    "Done the lot. Whoever you were this morning, she's gone. This is the upgrade.",
    "That's everything. You can lie down now. You've earned the horizontal 🛋️",
    "Full house! Nothing left but a brew and a biscuit. Go on.",
    "All done. Tomorrow's list is already scared of you.",
    "Clean sheet. Not a single job left to haunt you tonight 🌙",
  ];

  // no repeats until the whole bag's been used, and never the same one twice running
  const bags = new Map();
  function pick(arr){
    let bag = bags.get(arr);
    if(!bag || !bag.length){
      bag = [...arr].sort(()=>Math.random()-.5);
      const last = bags.get('last:'+arr.length+arr[0]);
      if(bag.length>1 && bag[bag.length-1]===last){ bag.unshift(bag.pop()); }
      bags.set(arr, bag);
    }
    const m = bag.pop();
    bags.set('last:'+arr.length+arr[0], m);
    return m;
  }

  let tasks = [];
  let order = [];
  let flipped = new Set();
  let mode = 'list';

  const $ = id => document.getElementById(id);
  const listMode=$('listMode'), deckMode=$('deckMode'), list=$('list'), emptyMsg=$('emptyMsg'),
        shuffleBtn=$('shuffleBtn'), grid=$('grid'), bar=$('bar'), count=$('count'),
        overlay=$('overlay'), popMsg=$('popMsg'), popKicker=$('popKicker');

  async function save(){
    const data = JSON.stringify({tasks, order, flipped:[...flipped], mode});
    try{ if(window.storage) await window.storage.set('gsd-list', data, false); }catch(e){}
  }
  async function load(){
    try{
      if(!window.storage) return;
      const r = await window.storage.get('gsd-list', false);
      if(!r) return;
      const d = JSON.parse(r.value);
      tasks = d.tasks||[]; order = d.order||[]; flipped = new Set(d.flipped||[]);
      mode = d.mode==='deck' ? 'game' : (d.mode||'list');
    }catch(e){}
  }

  function popup(kicker, msg){
    popKicker.textContent = kicker;
    popMsg.textContent = msg;
    overlay.classList.add('show');
    $('popClose').focus();
  }
  function closePop(){ overlay.classList.remove('show'); }
  $('popClose').onclick = closePop;
  overlay.onclick = e => { if(e.target===overlay) closePop(); };
  document.addEventListener('keydown', e => { if(e.key==='Escape') closePop(); });

  function confetti(n=60){
    const box=$('confetti');
    const cols=['#e9a2b8','#c9b3e8','#b7dfb9','#f6e29a','#d4788f','#fff'];
    for(let i=0;i<n;i++){
      const s=document.createElement('i');
      s.style.left=Math.random()*100+'vw';
      s.style.background=cols[Math.floor(Math.random()*cols.length)];
      s.style.animationDuration=(1.6+Math.random()*1.4)+'s';
      s.style.animationDelay=(Math.random()*.4)+'s';
      box.appendChild(s);
      setTimeout(()=>s.remove(),3200);
    }
  }

  // shared "you did one" logic for both modes
  function celebrate(){
    confetti(); updateProgress(); save();
    const all=tasks.length && tasks.every(x=>x.done);
    if(all){ setTimeout(()=>{ confetti(120); popup("that's everything", pick(ALLDONE)); },300); }
    else popup("done", pick(DONE));
  }

  /* ---------- LIST MODE ---------- */
  function renderList(){
    list.innerHTML='';
    tasks.forEach(t=>{
      const li=document.createElement('li');
      li.className=t.colour+(t.done?' done':'');
      li.innerHTML=`<button type="button" class="tick" aria-label="tick off">${t.done?'✓':''}</button><span class="txt"></span><button type="button" class="x" aria-label="remove">×</button>`;
      li.querySelector('.txt').textContent=t.text;
      li.querySelector('.tick').onclick=()=>{
        if(t.done){ t.done=false; flipped.delete(t.id); renderList(); save(); return; } // untick, quietly
        t.done=true; flipped.add(t.id); renderList(); celebrate();
      };
      li.querySelector('.x').onclick=()=>{ tasks=tasks.filter(x=>x.id!==t.id); order=order.filter(id=>id!==t.id); flipped.delete(t.id); renderList(); save(); };
      list.appendChild(li);
    });
    const has=tasks.length>0;
    emptyMsg.classList.toggle('hidden', has);
    $('listRow').classList.toggle('hidden', !has);
    $('listTop').classList.toggle('hidden', !has);
    $('listProgress').classList.toggle('hidden', !has);
    updateProgress();
  }
  function addTask(){
    const input=$('taskInput');
    const text=input.value.trim();
    if(!text) return;
    tasks.push({id:Date.now()+Math.random(), text, colour:COLOURS[tasks.length%COLOURS.length], done:false});
    input.value='';
    renderList(); save();
    popup("added", pick(ADDED));
  }
  $('addBtn').onclick=addTask;
  $('taskInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addTask(); });
  $('clearBtn').onclick=()=>{
    tasks=[]; order=[]; flipped=new Set(); renderList(); save();
    popup("fresh start", "clean slate. what's today's damage?");
  };

  /* ---------- GAME MODE ---------- */
  function shuffle(){
    // reshuffle the order and turn undone cards face down again; done ones stay done and ticked
    order = tasks.map(t=>t.id);
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    flipped=new Set(tasks.filter(t=>t.done).map(t=>t.id));
    const cols=[...COLOURS].sort(()=>Math.random()-.5);
    order.forEach((id,i)=>{ const t=tasks.find(x=>x.id===id); if(t) t.colour=cols[i%cols.length]; });
  }
  function syncOrder(){
    // keep the existing deal, drop deleted tasks, add any new ones on the end
    const ids=new Set(tasks.map(t=>t.id));
    order=order.filter(id=>ids.has(id));
    tasks.forEach(t=>{ if(!order.includes(t.id)) order.push(t.id); if(t.done) flipped.add(t.id); });
  }
  function completeTask(t, card){
    if(t.done) return;
    t.done=true; card.classList.add('done'); celebrate();
  }
  function renderDeck(){
    grid.innerHTML='';
    const has=tasks.length>0;
    $('deckEmpty').classList.toggle('hidden', has);
    $('deckBody').classList.toggle('hidden', !has);
    if(!has) return;
    order.forEach((id,i)=>{
      const t=tasks.find(x=>x.id===id); if(!t) return;
      const card=document.createElement('div');
      card.className='card'+(flipped.has(id)?' flipped':'')+(t.done?' done':'');
      card.tabIndex=0; card.setAttribute('role','button');
      card.innerHTML=`
        <div class="card-inner">
          <div class="face back">
            <svg class="bow-mini" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M60 40 C40 10 10 12 12 32 C14 50 40 50 60 40Z" fill="#e9a2b8"/>
              <path d="M60 40 C80 10 110 12 108 32 C106 50 80 50 60 40Z" fill="#e9a2b8"/>
              <path d="M60 40 L46 76 L58 66 L60 40Z" fill="#d4788f"/>
              <path d="M60 40 L74 76 L62 66 L60 40Z" fill="#d4788f"/>
              <circle cx="60" cy="40" r="9" fill="#d4788f"/>
            </svg>
            <div class="num">card ${i+1}</div>
          </div>
          <div class="face front ${t.colour}">
            <div class="stamp">✓</div>
            <div class="task"></div>
            <button type="button" class="small">Done it!</button>
          </div>
        </div>`;
      card.querySelector('.task').textContent=t.text;
      const doneBtn=card.querySelector('.small');
      const flip=()=>{
        if(flipped.has(id)) return;
        flipped.add(id); card.classList.add('flipped'); save();
        setTimeout(()=>popup("your next job", pick(FLIPPED)), 350);
      };
      card.addEventListener('click', e=>{ if(doneBtn.contains(e.target)) return; flip(); });
      card.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!flipped.has(id)) flip(); else completeTask(t, card); } };
      doneBtn.addEventListener('click', e=>{ e.stopPropagation(); completeTask(t, card); });
      grid.appendChild(card);
    });
    updateProgress();
  }
  function updateProgress(){
    const d=tasks.filter(t=>t.done).length;
    const pct=(tasks.length? d/tasks.length*100:0)+'%';
    bar.style.width=pct; $('listBar').style.width=pct;
    count.textContent=`${d} / ${tasks.length}`; $('listCount').textContent=`${d} / ${tasks.length}`;
  }

  /* ---------- MODE SWITCH ---------- */
  function setMode(m, opts={}){
    mode=m;
    const game = m==='game';
    $('modeList').classList.toggle('on', !game); $('modeList').setAttribute('aria-selected', String(!game));
    $('modeGame').classList.toggle('on', game); $('modeGame').setAttribute('aria-selected', String(game));
    listMode.classList.toggle('hidden', game);
    deckMode.classList.toggle('hidden', !game);
    if(game){
      if(opts.shuffle || !order.length) shuffle(); else syncOrder();
      renderDeck();
    } else {
      renderList();
    }
    save();
  }
  $('modeList').onclick=()=>setMode('list');
  $('modeGame').onclick=()=>setMode('game');
  shuffleBtn.onclick=()=>setMode('game',{shuffle:true});
  $('reshuffleBtn').onclick=()=>{ shuffle(); renderDeck(); save(); popup("re-dealt", "new order, same you. flip one 🩷"); };
  $('backBtn').onclick=()=>setMode('list');

  renderList();
  load().then(()=>{ setMode(mode); });
</script>
</body>
</html>
